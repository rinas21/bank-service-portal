server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Container-internal health probe.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # The SPA owns client-side routing, so unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets are immutable and can be cached aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, otherwise clients load stale asset references.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # The API is reached through the reverse proxy under /api, so the browser
    # never needs a cross-origin request to the backend container.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # $proxy_add_x_forwarded_for appends the real peer to any client-supplied
        # value. The API trusts only the right-most entry (ForwardLimit = 1), so
        # a spoofed header cannot change the client IP used for rate limiting.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /health/ {
        proxy_pass http://api:8080/health/;
        proxy_set_header Host $host;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
